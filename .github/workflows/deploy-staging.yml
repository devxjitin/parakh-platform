name: Deploy staging

# Manual only: staging is stopped to save cost (2026-11-24). To bring back the automatic deploy
# after CI on main, restore the workflow_run trigger and point the staging OIDC trust at this repo.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  ENVIRONMENT: staging
  AWS_REGION: ap-south-1

jobs:
  guard:
    # Only deploy when CI succeeded (or when started manually).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed, deploying ${{ github.sha }}"

  web:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build -w @parakh/shared
        # NEXT_PUBLIC_* values are baked in at build time.
      - run: npm run build -w @parakh/web
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.API_HOSTNAME }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: staging
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload site to S3
        run: |
          # Hashed assets are immutable; HTML must always be revalidated.
          aws s3 sync apps/web/out "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/out "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

  backend:
    needs: guard
    # The server is ARM (Graviton), so build on a native ARM runner. Emulating arm64 with QEMU on
    # an x86 runner was slow and sometimes hung for 30+ minutes. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    environment: staging
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # Native arm64 build: no QEMU needed.
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the API image
        run: |
          docker buildx build --platform linux/arm64 \
            -t "${{ steps.ecr.outputs.registry }}/parakh-$ENVIRONMENT-api:$IMAGE_TAG" \
            -t "${{ steps.ecr.outputs.registry }}/parakh-$ENVIRONMENT-api:latest" \
            --push .
      - name: Upload deploy files
        run: aws s3 cp infra/deploy "s3://${{ vars.FILES_BUCKET }}/deploy/" --recursive
      - name: Deploy on the server (SSM)
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE_TAG" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/parakh && cd /opt/parakh\",
              \"aws s3 cp s3://${{ vars.FILES_BUCKET }}/deploy/ . --recursive --region $AWS_REGION\",
              \"chmod +x deploy.sh\",
              \"ENVIRONMENT=$ENVIRONMENT AWS_REGION=$AWS_REGION FILES_BUCKET=${{ vars.FILES_BUCKET }} ECR_REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG API_HOST=${{ vars.API_HOSTNAME }} WEB_ORIGIN=https://${{ vars.WEB_HOSTNAME }} DB_HOST=${{ vars.DB_HOST }} DB_SECRET_ARN=${{ vars.DB_SECRET_ARN }} ./deploy.sh\"
            ]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ] || { echo "Deploy failed: $STATUS"; exit 1; }
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.API_HOSTNAME }}/health"
