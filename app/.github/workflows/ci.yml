name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parakh
          POSTGRES_PASSWORD: parakh
          POSTGRES_DB: parakh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parakh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://parakh:parakh@localhost:5432/parakh_test
      DATABASE_URL: postgresql://parakh:parakh@localhost:5432/parakh_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Browser smoke tests: the real web app and API on a real database (see apps/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parakh
          POSTGRES_PASSWORD: parakh
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parakh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @parakh/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results

  images:
    # Proves the API image builds (no push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build -t parakh-api:ci .
