# Local development services. Run: npm run infra:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh
      POSTGRES_DB: parakh
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
