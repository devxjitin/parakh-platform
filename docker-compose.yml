# NandiRank: the whole product on Docker Desktop, nothing deployed.
#
#   docker compose up -d        start everything (first run installs packages, takes a few minutes)
#   docker compose logs -f api  watch the API; sign-in codes and emails are printed here
#   docker compose down         stop (data is kept)   |   docker compose down -v   stop and wipe data
#
# App      http://localhost:3000   (trainer app and student join/exam pages)
# Website  http://localhost:3100   (NandiRank landing page)
# API      http://localhost:4000/health
# Database localhost:5440  (user parakh, password parakh, database parakh)
#
# Payments are fake (the checkout is simulated) and emails are written to the API log, so nothing
# real is charged or sent. Source code is mounted from ./app and ./website and reloads on save.

name: nandirank

x-node: &node
  image: node:22-alpine
  working_dir: /app
  environment: &node-env
    NODE_ENV: development
    # File changes made on Windows do not reach a Linux container as events, so poll for them.
    WATCHPACK_POLLING: "true"
    CHOKIDAR_USEPOLLING: "true"
    TSC_WATCHFILE: PriorityPollingInterval
    NEXT_TELEMETRY_DISABLED: "1"
    DATABASE_URL: postgresql://parakh:parakh@db:5432/parakh

x-app-volumes: &app-volumes
  - ./app:/app
  - app_node_modules:/app/node_modules
  - api_node_modules:/app/apps/api/node_modules
  - web_node_modules:/app/apps/web/node_modules
  - web_next:/app/apps/web/.next
  - e2e_node_modules:/app/apps/e2e/node_modules
  - shared_node_modules:/app/packages/shared/node_modules
  - parser_node_modules:/app/packages/question-parser/node_modules

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh
      POSTGRES_DB: parakh
    ports:
      - "5440:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parakh -d parakh"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once: installs packages for Linux, builds the shared code and the API, applies migrations.
  init:
    <<: *node
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             npm ci --no-audit --no-fund &&
             npm run build -w @parakh/shared &&
             npm run build -w @parakh/api &&
             npm run db:migrate -w @parakh/api"

  api:
    <<: *node
    volumes: *app-volumes
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      <<: *node-env
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      WEBSITE_ORIGIN: http://localhost:3100
      JWT_ACCESS_SECRET: local-docker-access-secret-0123456789abcdef
      OTP_SECRET: local-docker-otp-secret-0123456789abcdef
      DATA_ENCRYPTION_KEY: local-docker-data-key-0123456789abcdef
      SES_EVENTS_KEY: local-docker-ses-events-key
      # Emails are only printed to the API log unless you copy .env.example to .env and fill in Resend.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PAYMENT_PROVIDER: fake
      STORAGE_DRIVER: memory
      COOKIE_SECURE: "false"
      OTP_RESEND_SECONDS: "5"
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             npm run dev -w @parakh/api"

  web:
    <<: *node
    # The dev server can crash when node_modules is rebuilt by `init`; bring it back by itself.
    restart: unless-stopped
    volumes: *app-volumes
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      <<: *node-env
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    command: npm run dev -w @parakh/web -- -H 0.0.0.0

  website:
    <<: *node
    working_dir: /site
    volumes:
      - ./website:/site
      - ./app/packages:/app/packages:ro
      - website_node_modules:/site/node_modules
      - website_next:/site/.next
    ports:
      - "3100:3100"
    environment:
      <<: *node-env
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -- -H 0.0.0.0"

volumes:
  dbdata:
  app_node_modules:
  api_node_modules:
  web_node_modules:
  web_next:
  e2e_node_modules:
  shared_node_modules:
  parser_node_modules:
  website_node_modules:
  website_next:
